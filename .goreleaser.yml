# GoReleaser configuration producing Terraform/OpenTofu provider release
# artifacts: terraform-provider-simplelogin_<version>_<os>_<arch>.zip archives
# containing terraform-provider-simplelogin_v<version>, plus a SHA256SUMS file
# and the registry manifest.
version: 2
project_name: terraform-provider-simplelogin
builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    targets:
      - linux_amd64
      - linux_arm64
      - windows_amd64
    binary: "{{ .ProjectName }}_v{{ .Version }}"
archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
# Publishing to the Terraform Registry additionally requires a GPG-signed
# SHA256SUMS file (a "signs" section). Not needed for filesystem mirrors.
release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # Releases are created as drafts; publish them manually after review.
  draft: true
changelog:
  disable: true
